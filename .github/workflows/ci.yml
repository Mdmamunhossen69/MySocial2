name: KING CODER checks
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/autonomous.js
          node --check src/ai.js
      - name: Check frontend JavaScript syntax
        run: |
          node -e 'const fs=require("node:fs"); const html=fs.readFileSync("public/index.html","utf8"); const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)]; if(!scripts.length) throw new Error("No inline frontend script found"); fs.writeFileSync("/tmp/king-coder-frontend.js",scripts[scripts.length-1][1]);'
          node --check /tmp/king-coder-frontend.js
      - name: Test zero-cost AI guard
        run: node --experimental-default-type=module --test tests/*.test.mjs
      - name: Check whitespace errors
        run: git diff --check

      - name: Smoke test production website and protected routes
        env:
          WORKER_URL: https://mysocial2.mdmamunhossenlimon7.workers.dev
        run: |
          set -euo pipefail
          curl --retry 8 --retry-delay 2 --retry-all-errors -fsS "$WORKER_URL/" -o /tmp/king-coder-home.html
          grep -q "KING CODER" /tmp/king-coder-home.html
          echo "Homepage smoke test passed"
          curl --retry 3 --retry-delay 2 --retry-all-errors -L -fsS "$WORKER_URL/admin.html" -o /tmp/king-coder-admin.html
          grep -q "KING CODER" /tmp/king-coder-admin.html
          echo "Admin page smoke test passed (redirect /admin.html → /admin)"
          curl --retry 8 --retry-delay 2 --retry-all-errors -fsS "$WORKER_URL/api/health" -o /tmp/king-coder-health.json
          cat /tmp/king-coder-health.json
          node -e 'const h=require("/tmp/king-coder-health.json"); for (const k of ["ok","configured","geminiApiKeyConfigured","geminiBillingVerified","githubConfigured","databaseConfigured"]) if (h[k] !== true) throw new Error("Production health failed: "+k);'
          echo "Health smoke test passed"
          curl --retry 8 --retry-delay 2 --retry-all-errors -fsS "$WORKER_URL/api/github/status" -o /tmp/king-coder-github.json
          cat /tmp/king-coder-github.json
          node -e 'const s=require("/tmp/king-coder-github.json"); if (s.configured !== true || s.connected !== false) throw new Error("GitHub OAuth status endpoint failed");'
          echo "GitHub status smoke test passed"
          code="$(curl -sS -o /tmp/king-coder-admin-guard.json -w '%{http_code}' "$WORKER_URL/api/admin/summary")"
          echo "Admin guard HTTP status: $code"
          test "$code" = "401"
          code="$(curl -sS -o /tmp/king-coder-build-guard.json -w '%{http_code}' -X POST -H "Origin: $WORKER_URL" -H "Content-Type: application/json" --data '{"prompt":"smoke test"}' "$WORKER_URL/api/build")"
          echo "Build guard HTTP status: $code"
          test "$code" = "401"

          oauth_status="$(curl -sS -D /tmp/king-coder-oauth.headers -o /dev/null -w '%{http_code}' "$WORKER_URL/api/github/login")"
          echo "GitHub OAuth login redirect HTTP status: $oauth_status"
          test "$oauth_status" = "302"
          grep -qi "location: https://github.com/login/oauth/authorize" /tmp/king-coder-oauth.headers
