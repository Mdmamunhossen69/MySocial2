name: KING CODER checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/autonomous.js
          node --check src/ai.js
      - name: Check frontend JavaScript syntax
        run: |
          node -e 'const fs=require("node:fs"); const html=fs.readFileSync("public/index.html","utf8"); const scripts=[...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)]; if(!scripts.length) throw new Error("No inline frontend script found"); fs.writeFileSync("/tmp/king-coder-frontend.js",scripts[scripts.length-1][1]);'
          node --check /tmp/king-coder-frontend.js
      - name: Check whitespace errors
        run: git diff --check
