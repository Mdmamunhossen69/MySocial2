name: Build KING CODER Android APK

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: king-coder-android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Capacitor
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Add Android microphone permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''<uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
          '''
          if "android.permission.RECORD_AUDIO" not in s:
              s = s.replace(marker, marker + "\n    " + permissions, 1)
          p.write_text(s)
          PY

      - name: Generate KING CODER launcher icons
        run: |
          python3 -m pip install --quiet cairosvg
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          python3 - <<'PY'
          from pathlib import Path
          import cairosvg
          svg = Path("assets/king-coder-icon.svg").read_bytes()
          root = Path("android/app/src/main/res")
          for density, size in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              folder = root / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              for name in ["ic_launcher.png","ic_launcher_round.png","ic_launcher_foreground.png"]:
                  cairosvg.svg2png(bytestring=svg,write_to=str(folder/name),output_width=size,output_height=size)
          adaptive = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          '''
          anydpi = root / "mipmap-anydpi-v26"
          (anydpi / "ic_launcher.xml").write_text(adaptive)
          (anydpi / "ic_launcher_round.xml").write_text(adaptive)
          PY

      - name: Build debug APK
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug
          cd ..
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/KING-CODER.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KING-CODER-Android-APK
          path: release/KING-CODER.apk
          retention-days: 30

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: KING CODER — Latest Android APK
          body: |
            সর্বশেষ KING CODER Android APK।

            অ্যাপটি লাইভ KING CODER ওয়েব অ্যাপ লোড করে। ওয়েবসাইটে নতুন ফিচার Deploy হলে অ্যাপেও তা স্বয়ংক্রিয়ভাবে দেখা যাবে; সাধারণ ওয়েব আপডেটের জন্য APK পুনরায় ইনস্টল প্রয়োজন নেই।
          files: release/KING-CODER.apk
          overwrite_files: true
          make_latest: false
