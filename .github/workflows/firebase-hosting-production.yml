name: Deploy MySocial2 Public Website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mysocial2-public-hosting-deploy
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate application and Firestore rules
        run: |
          npm test
          npm run test:rules

      - name: Build public site with staging Firebase config
        run: npm run build:hosting
        env:
          FIREBASE_TARGET: staging

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_PRODUCTION_HOSTING_SERVICE_ACCOUNT }}

      - name: Deploy Hosting, Firestore rules, and indexes to MySocial2-Staging
        run: npx firebase-tools deploy --only hosting,firestore:rules,firestore:indexes --project mysocial2-staging --non-interactive
