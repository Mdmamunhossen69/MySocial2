name: Firebase Hosting Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: firebase-hosting-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-and-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run JavaScript, configuration, and Hosting bundle tests
        run: npm test

      - name: Run Firestore Rules emulator tests
        run: npm run test:rules

      - name: Build allowlisted production bundle for validation
        run: npm run build:hosting

      - name: Build isolated staging bundle
        if: vars.FIREBASE_STAGING_HOSTING_PREVIEW_ENABLED == 'true'
        env:
          FIREBASE_TARGET: staging
        run: npm run build:hosting

      - name: Verify staging Firebase Hosting credential exists
        if: vars.FIREBASE_STAGING_HOSTING_PREVIEW_ENABLED == 'true'
        env:
          FIREBASE_STAGING_HOSTING_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_STAGING_HOSTING_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_STAGING_HOSTING_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing repository Actions secret FIREBASE_STAGING_HOSTING_SERVICE_ACCOUNT."
            echo "Add a dedicated staging-project Hosting service-account JSON as an encrypted repository secret."
            exit 1
          fi

      - name: Deploy temporary staging Firebase Hosting preview
        if: vars.FIREBASE_STAGING_HOSTING_PREVIEW_ENABLED == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_STAGING_HOSTING_SERVICE_ACCOUNT }}
          projectId: mysocial2-staging
          expires: 7d
