name: Approved KING CODER Cloudflare publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/autonomous.js
          node --check src/ai.js
      - name: Check existing Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Cloudflare credentials are missing. No deployment was performed."
            exit 1
          fi
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Smoke test production endpoints
        env:
          WORKER_URL: https://mysocial2.mdmamunhossenlimon7.workers.dev
        run: |
          set -euo pipefail
          curl --retry 10 --retry-delay 3 --retry-all-errors -fsS "$WORKER_URL/api/health" -o /tmp/king-coder-health.json
          node -e 'const h=require("/tmp/king-coder-health.json"); for (const k of ["ok","configured","geminiApiKeyConfigured","geminiBillingVerified","githubConfigured","databaseConfigured"]) if (h[k] !== true) throw new Error("Production health check failed: "+k);'
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$WORKER_URL/" | grep -q "KING CODER"
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS "$WORKER_URL/admin.html" | grep -q "KING CODER"
