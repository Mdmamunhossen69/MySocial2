name: Deploy KING CODER to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Cloudflare deployment secrets
        id: config
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets."
          fi

      - name: Create per-user usage table
        if: steps.config.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.x"
          command: d1 execute king-coder-db --remote --command "CREATE TABLE IF NOT EXISTS user_usage (user_id TEXT NOT NULL, usage_date TEXT NOT NULL, chat_count INTEGER NOT NULL DEFAULT 0, build_count INTEGER NOT NULL DEFAULT 0, code_count INTEGER NOT NULL DEFAULT 0, PRIMARY KEY (user_id, usage_date)); CREATE INDEX IF NOT EXISTS user_usage_date_idx ON user_usage(usage_date);"

      - name: Deploy Worker and static assets
        if: steps.config.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.x"
          command: deploy
