name: Prepare KING CODER Cloudflare D1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-database:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Cloudflare deployment secrets
        id: config
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare D1 preparation skipped because repository Actions credentials are not configured."
          fi

      - name: Create per-user usage tables
        if: steps.config.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.x"
          command: d1 execute king-coder-db --remote --command "CREATE TABLE IF NOT EXISTS user_usage (user_id TEXT NOT NULL, usage_date TEXT NOT NULL, chat_count INTEGER NOT NULL DEFAULT 0, build_count INTEGER NOT NULL DEFAULT 0, code_count INTEGER NOT NULL DEFAULT 0, PRIMARY KEY (user_id, usage_date)); CREATE INDEX IF NOT EXISTS user_usage_date_idx ON user_usage(usage_date); CREATE TABLE IF NOT EXISTS user_activity (user_id TEXT PRIMARY KEY, last_seen INTEGER NOT NULL, last_feature TEXT NOT NULL); CREATE INDEX IF NOT EXISTS user_activity_last_seen_idx ON user_activity(last_seen);"
