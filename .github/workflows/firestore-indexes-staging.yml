name: Deploy Firestore Indexes to Staging

on:
  workflow_dispatch:
  push:
    branches:
      - feat/firebase-hosting-preview-main
    paths:
      - firestore.indexes.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: mysocial2-staging-firestore-indexes
  cancel-in-progress: false

jobs:
  deploy-staging-indexes:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out reviewed repository files
        uses: actions/checkout@v4

      - name: Validate Firestore index configuration
        run: |
          node -e "const c=JSON.parse(require('node:fs').readFileSync('firestore.indexes.json','utf8')); if (!Array.isArray(c.indexes) || c.indexes.length !== 6) throw new Error('Expected exactly 6 composite indexes'); console.log('Validated', c.indexes.length, 'indexes');"

      - name: Authenticate to the staging Google Cloud project
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_STAGING_INDEXES_SERVICE_ACCOUNT }}
          project_id: mysocial2-staging

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firestore indexes to staging only
        run: firebase deploy --only firestore:indexes --project mysocial2-staging --non-interactive
